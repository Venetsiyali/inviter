<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziza & Jasur - Taklifnoma</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Raleway:wght@300;400;600&display=swap');

        :root {
            --primary: #0A0A0A;
            --secondary: #FFD700;
            --bg: #111111;
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
            --silver: #C0C0C0;
            --glow: rgba(255, 215, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: 'Raleway', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            position: relative;
        }

        /* Starry background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(var(--text-muted) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            z-index: 0;
        }

        .invitation-card {
            background: linear-gradient(180deg, var(--primary) 0%, #1a1a1a 100%);
            width: 100%;
            max-width: 480px;
            min-height: 90vh;
            position: relative;
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            overflow: hidden;
            animation: fadeIn 1.2s ease-out;
            z-index: 1;
        }

        /* Inner border decoration */
        .invitation-card::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid rgba(192, 192, 192, 0.2);
            pointer-events: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                box-shadow: none;
            }

            to {
                opacity: 1;
                box-shadow: 0 0 40px var(--glow);
            }
        }

        /* HERO SECTION */
        .hero-section {
            margin-bottom: 40px;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            color: var(--silver);
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            position: relative;
        }

        .badge::after,
        .badge::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 1px;
            background: var(--silver);
            opacity: 0.5;
        }

        .badge::before {
            left: -40px;
        }

        .badge::after {
            right: -40px;
        }

        .hero-section h1 {
            font-family: 'Cinzel', serif;
            font-size: 40px;
            color: var(--secondary);
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 0 20px var(--glow);
            background: linear-gradient(to right, #B48B3D, var(--secondary), #B48B3D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite linear;
            background-size: 200% auto;
        }

        .ampersand {
            display: block;
            color: var(--silver);
            font-size: 30px;
            font-style: italic;
            margin: 0;
            -webkit-text-fill-color: var(--silver);
            text-shadow: none;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        /* DATE & TIME */
        .date-time {
            margin: 40px 0;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        .date-time .date {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--secondary);
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .date-time .time {
            font-size: 15px;
            color: var(--text-main);
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* VENUE */
        .venue {
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        .venue h3 {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--silver);
            margin-bottom: 10px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .venue p {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        /* QR PLACEHOLDER */
        .qr-placeholder {
            width: 150px;
            height: 150px;
            background: #1A1A1A;
            border: 1px solid var(--secondary);
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* BUTTONS */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .btn {
            padding: 18px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .gift-btn {
            border: 1px solid var(--secondary);
            color: var(--secondary);
            background: rgba(255, 215, 0, 0.05);
        }

        .gift-btn:hover {
            background: var(--secondary);
            color: var(--primary);
            box-shadow: 0 0 15px var(--glow);
        }

        .photo-btn {
            border: 1px solid var(--silver);
            color: var(--silver);
        }

        .photo-btn:hover {
            background: var(--silver);
            color: var(--primary);
        }

        /* FOOTER */
        .footer {
            position: relative;
            z-index: 2;
        }

        .footer .phone {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .footer .share-btn {
            background: none;
            border: none;
            color: var(--secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            padding-bottom: 3px;
            transition: 0.3s;
        }

        .footer .share-btn:hover {
            border-bottom-color: var(--secondary);
        }

        /* MOBILE RESPONSIVE */
        @media screen and (max-width: 480px) {
            body {
                padding: 0;
                background: var(--bg);
            }

            .invitation-card {
                border-radius: 0;
                border: none;
                border-top: 1px solid var(--secondary);
                min-height: 100vh;
                padding: 30px 20px;
            }

            .invitation-card::after {
                display: none;
            }

            .hero-section h1 {
                font-size: 34px;
                line-height: 1.3;
            }

            .venue h3 {
                font-size: 18px;
            }

            .btn {
                font-size: 12px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="invitation-card">
        <div class="hero-section">
            <div class="badge">EKSKLYUZIV TAKLIFNOMA</div>
            <h1>Aziza <br><span class="ampersand">&</span><br> Jasur</h1>
        </div>

        <div class="date-time">
            <div class="date">ON BESHINCHI IYUN, IKKI MING YIGIRMA OLTINCHI YIL</div>
            <div class="time">SOAT 12:00 DA TASHRIF BUYURING</div>
        </div>

        <div class="venue">
            <h3>Guliston Banquet Hall</h3>
            <p>Toshkent shahri, Yunusobod tumani,<br>14-mavze, Oltin tepa ko'chasi</p>
        </div>

        <div class="qr-placeholder">
            QR KOD
        </div>

        <div class="actions">
            <button class="btn gift-btn">💝 Hadya Yuborish</button>
            <button class="btn photo-btn">📸 Rasm Yuklash</button>
        </div>

        <div class="footer">
            <a href="tel:+998901234567" class="phone">+998 90 123 45 67</a>
            <button class="share-btn">Ulashish</button>
        </div>
    </div>

</body>

</html>
