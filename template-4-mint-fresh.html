<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziza & Jasur - Taklifnoma</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #00897B;
            --secondary: #E0F2F1;
            --bg: #FFFFFF;
            --text-main: #263238;
            --text-muted: #607D8B;
            --accent: #FFCA28;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f7f6;
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            overflow-x: hidden;
        }

        .invitation-card {
            background: var(--bg);
            width: 100%;
            max-width: 480px;
            min-height: 90vh;
            position: relative;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 137, 123, 0.1);
            text-align: center;
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
            z-index: 1;
        }

        /* Abstract geometric background elements */
        .invitation-card::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: var(--secondary);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.6;
            animation: pulse-shape 6s infinite alternate;
        }

        .invitation-card::after {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: rgba(0, 137, 123, 0.05);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            z-index: -1;
            animation: morph-shape 8s infinite alternate;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-shape {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.1);
            }
        }

        @keyframes morph-shape {
            0% {
                border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
                transform: rotate(0deg);
            }

            100% {
                border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
                transform: rotate(45deg);
            }
        }

        /* HERO SECTION */
        .hero-section {
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 137, 123, 0.3);
        }

        .hero-section h1 {
            font-size: 44px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .ampersand {
            display: block;
            color: var(--accent);
            font-size: 40px;
            font-weight: 300;
            margin: -5px 0;
            font-style: italic;
        }

        /* CARD-IN-CARD CONTENT */
        .content-card {
            background: #ffffff;
            border: 1px solid var(--secondary);
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 35px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            z-index: 2;
        }

        /* DATE & TIME */
        .date-time {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--secondary);
        }

        .date-time .date {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-time .time {
            font-size: 14px;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .date-time .time::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
        }

        /* VENUE */
        .venue h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .venue p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        /* QR PLACEHOLDER */
        .qr-placeholder {
            width: 140px;
            height: 140px;
            background: #F9FAFB;
            border: 2px solid var(--secondary);
            border-radius: 16px;
            margin: 0 auto 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }

        .qr-placeholder::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            100% {
                left: 200%;
            }
        }

        /* BUTTONS */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            z-index: 2;
            position: relative;
        }

        .btn {
            padding: 16px;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .gift-btn {
            background: var(--primary);
            color: white;
        }

        .gift-btn:active,
        .gift-btn:hover {
            transform: scale(0.98);
            background: #00796B;
        }

        .photo-btn {
            background: var(--secondary);
            color: var(--primary);
        }

        .photo-btn:active,
        .photo-btn:hover {
            transform: scale(0.98);
            background: #B2DFDB;
        }

        /* FOOTER */
        .footer {
            padding-top: 15px;
            position: relative;
            z-index: 2;
        }

        .footer .phone {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
        }

        .footer .share-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 5px;
        }

        .footer .share-btn:hover {
            color: var(--accent);
        }

        /* MOBILE RESPONSIVE */
        @media screen and (max-width: 480px) {
            body {
                padding: 0;
                background: var(--bg);
            }

            .invitation-card {
                border-radius: 0;
                box-shadow: none;
                min-height: 100vh;
                padding: 30px 20px;
            }

            .hero-section h1 {
                font-size: 38px;
            }

            .content-card {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="invitation-card">
        <div class="hero-section">
            <div class="badge">Nikoh To'yi</div>
            <h1>Aziza</h1>
            <span class="ampersand">&</span>
            <h1>Jasur</h1>
        </div>

        <div class="content-card">
            <div class="date-time">
                <div class="date">15 Iyun, 2026 - Shanba</div>
                <div class="time">Soat 12:00 da</div>
            </div>

            <div class="venue">
                <h3>Guliston Banquet Hall</h3>
                <p>Toshkent sh., Yunusobod tumani, 14-mavze</p>
            </div>
        </div>

        <div class="qr-placeholder">
            QR Kod
        </div>

        <div class="actions">
            <button class="btn gift-btn">💝 Hadya yuborish</button>
            <button class="btn photo-btn">📸 Rasm yuklash</button>
        </div>

        <div class="footer">
            <a href="tel:+998901234567" class="phone">📞 +998 90 123 45 67</a><br>
            <button class="share-btn">Ulashish</button>
        </div>
    </div>

</body>

</html>
